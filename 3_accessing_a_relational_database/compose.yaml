services:
  mysql:
    image: mysql:latest
    container_name: go_tutorial_3_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: root_user
      MYSQL_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: